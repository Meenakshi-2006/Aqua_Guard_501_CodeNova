<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Registration | AquaGuard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2747 0%, #1d4ed8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 34px 30px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }
        .brand {
            text-align: center;
            margin-bottom: 22px;
        }
        .brand h1 {
            color: #12345a;
            font-size: 25px;
            margin-bottom: 6px;
        }
        .brand p {
            color: #64748b;
            font-size: 13.5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #12345a;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: #ffffff;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #2196f3;
        }
        .btn-submit {
            width: 100%;
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-submit:hover {
            background: #15803d;
        }
        .msg-box {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
        .msg-error { background: #fee2e2; color: #dc2626; }
        .msg-success { background: #dcfce7; color: #15803d; }
        .auth-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            color: #64748b;
        }
        .auth-footer a {
            color: #2196f3;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand">
        <h1>🏠 Resident Registration</h1>
        <p>Register to monitor water usage &amp; alerts for your block</p>
    </div>

    <div class="msg-box msg-error" id="regError"></div>
    <div class="msg-box msg-success" id="regSuccess"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="e.g., Bhoomika S M" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="resident@aquaguard.org" required>
        </div>

        <div class="form-group">
            <label for="locationSelect">Select Your Block / Location</label>
            <select id="locationSelect" required>
                <option value="">-- Loading available locations --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Create Password</label>
            <input type="password" id="password" placeholder="Minimum 6 characters" minlength="4" required>
        </div>

        <button type="submit" class="btn-submit">Register Resident Account</button>
    </form>

    <div class="auth-footer">
        Already registered? <a href="/login">Back to Sign In</a>
    </div>
</div>

<script>
const DEFAULT_LOCATIONS = [
    "Main Gate Inlet",
    "Hostel Block A",
    "Hostel Block B Tank",
    "Mess & Kitchen"
];

document.addEventListener("DOMContentLoaded", async function () {
    const select = document.getElementById("locationSelect");
    let locations = [...DEFAULT_LOCATIONS];

    try {
        const res = await fetch("/api/locations");
        if (res.ok) {
            const data = await res.json();
            if (data.success && Array.isArray(data.locations) && data.locations.length > 0) {
                locations = data.locations.map(l => typeof l === "string" ? l : l.name);
            }
        }
    } catch (e) {}

    select.innerHTML = '<option value="">-- Choose Your Assigned Block --</option>';
    locations.forEach(loc => {
        const opt = document.createElement("option");
        opt.value = loc;
        opt.textContent = loc;
        select.appendChild(opt);
    });
});

async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const location_id = document.getElementById("locationSelect").value;
    const password = document.getElementById("password").value;

    const errBox = document.getElementById("regError");
    const okBox = document.getElementById("regSuccess");
    errBox.style.display = "none";
    okBox.style.display = "none";

    if (!location_id) {
        errBox.textContent = "Please select your assigned block/location.";
        errBox.style.display = "block";
        return;
    }

    try {
        const res = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, location_id, password, role: "resident" })
        });
        const data = await res.json();
        if (data.success) {
            okBox.textContent = "Registration successful! Redirecting to login...";
            okBox.style.display = "block";
            setTimeout(() => { window.location.href = "/login"; }, 1200);
        } else {
            errBox.textContent = data.error || "Registration failed.";
            errBox.style.display = "block";
        }
    } catch (err) {
        errBox.textContent = "Server error during registration.";
        errBox.style.display = "block";
    }
}
</script>

</body>
</html>
