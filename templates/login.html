<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AquaGuard Smart Water Monitoring</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2747 0%, #1d4ed8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 34px 30px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }
        .brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand h1 {
            color: #12345a;
            font-size: 26px;
            margin-bottom: 6px;
        }
        .brand p {
            color: #64748b;
            font-size: 14px;
        }
        .role-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 10px;
        }
        .role-tab {
            border: none;
            background: transparent;
            padding: 9px 6px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-tab.active {
            background: #2196f3;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(33, 150, 243, 0.35);
        }
        .role-hint {
            background: #eff6ff;
            border-left: 4px solid #2196f3;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            color: #1e3a8a;
            margin-bottom: 18px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #12345a;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2196f3;
        }
        .btn-submit {
            width: 100%;
            background: #2196f3;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-submit:hover {
            background: #1976d2;
        }
        .error-msg {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
        .auth-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            color: #64748b;
        }
        .auth-footer a {
            color: #2196f3;
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand">
        <h1>💧 AquaGuard</h1>
        <p>Smart Water Leakage &amp; Consumption Portal</p>
    </div>

    <div class="role-tabs">
        <button type="button" class="role-tab active" onclick="selectRole('admin', this)">Admin</button>
        <button type="button" class="role-tab" onclick="selectRole('management', this)">Management</button>
        <button type="button" class="role-tab" onclick="selectRole('resident', this)">Resident</button>
    </div>

    <div class="role-hint" id="roleHint">
        <strong>Admin Access:</strong> Full control to view all blocks, add locations/sensors, and manage leak alerts.
    </div>

    <div class="error-msg" id="loginError"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <input type="hidden" id="selectedRole" name="role" value="admin">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="admin@aquaguard.org" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <div class="auth-footer" id="residentRegisterLink">
        New Resident? <a href="/register">Register with your Block / Location</a>
    </div>
</div>

<script>
const roleHints = {
    admin: "<strong>Admin Access:</strong> Full control to view all blocks, add locations/sensors, and manage leak alerts.",
    management: "<strong>Management Access:</strong> View-only monitoring across all campus locations and analytics (cannot edit or add sensors).",
    resident: "<strong>Resident Access:</strong> View live water usage, readings, and leak alerts restricted strictly to your registered block."
};

function selectRole(role, btn) {
    document.getElementById("selectedRole").value = role;
    document.querySelectorAll(".role-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("roleHint").innerHTML = roleHints[role];

    const emailInput = document.getElementById("email");
    if (role === "admin") emailInput.placeholder = "admin@aquaguard.org";
    else if (role === "management") emailInput.placeholder = "manager@aquaguard.org";
    else emailInput.placeholder = "resident@aquaguard.org";
}

async function handleLogin(e) {
    e.preventDefault();
    const role = document.getElementById("selectedRole").value;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errBox = document.getElementById("loginError");
    errBox.style.display = "none";

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ role, email, password })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem("aquaguard_user", JSON.stringify(data.user));
            window.location.href = "/";
        } else {
            errBox.textContent = data.error || "Invalid credentials for selected role.";
            errBox.style.display = "block";
        }
    } catch (err) {
        errBox.textContent = "Server error while signing in. Check Flask terminal.";
        errBox.style.display = "block";
    }
}
</script>

</body>
</html>
