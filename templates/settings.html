
{% extends "base.html" %}

{% block page_title %}Settings{% endblock %}

{% block content %}

<style>
.settings-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.settings-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.settings-card h3 {
    margin-bottom: 18px;
    color: #0f2747;
}

.settings-card label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

.settings-card input {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

.settings-card input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
}

.setting-option {
    margin: 15px 0;
}

.save-btn {
    margin-top: 20px;
    padding: 12px 25px;
    background: #0f766e;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.save-btn:hover {
    background: #115e59;
}

@media(max-width: 700px) {
    .settings-container {
        grid-template-columns: 1fr;
    }
}
</style>

<div class="settings-container">

    <div class="settings-card">
        <h3>👤 Profile Settings</h3>

        <label>Name</label>
        <input type="text" value="AquaGuard Admin">

        <label>Email</label>
        <input type="email" value="admin@aquaguard.com">

        <label>Role</label>
        <input type="text" value="Administrator" readonly>
    </div>

    <div class="settings-card">
        <h3>🔔 Notification Settings</h3>

        <div class="setting-option">
            <label>
                <input type="checkbox" checked>
                Leak Detection Alerts
            </label>
        </div>

        <div class="setting-option">
            <label>
                <input type="checkbox" checked>
                High Water Usage Alerts
            </label>
        </div>

        <div class="setting-option">
            <label>
                <input type="checkbox">
                Daily Reports
            </label>
        </div>
    </div>

    <div class="settings-card">
        <h3>💧 Leak Detection Thresholds</h3>

        <label>High Flow Threshold (L/min)</label>
        <input type="number" value="50" min="1">

        <label>Night Flow Threshold (L/min)</label>
        <input type="number" value="10" min="1">

        <label>Alert Sensitivity</label>
        <input type="number" value="75" min="1" max="100">
    </div>

    <div class="settings-card">
        <h3>⚙️ System Information</h3>

        <p><b>Application:</b> AquaGuard</p><br>
        <p><b>Version:</b> 1.0.0</p><br>
        <p><b>Platform:</b> Flask</p><br>
        <p><b>Project:</b> Water Monitoring System</p>
    </div>

</div>

<button class="save-btn" onclick="saveSettings()">
    Save Settings
</button>

<script>
function saveSettings() {
    alert("Settings updated successfully! (Demo only)");
}
</script>

{% endblock %}
